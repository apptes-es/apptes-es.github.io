<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#10233D">
<title>TES Test · Técnico en Emergencias Sanitarias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    var t = localStorage.getItem('tes_theme_v1');
    if(!t){ t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
    if(t === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TES Test">
</head>
<body>
<div class="app">
  <div class="topbar">
    <button type="button" class="brand" data-action="renderHome" aria-label="Ir al inicio">
      <span class="brand-logo" id="brandLogo"></span>
      <div>
        <h1>TES <span>Test</span></h1>
        <div class="sub" id="topbarSub">Técnico en Emergencias Sanitarias</div>
      </div>
    </button>
    <div class="topbar-actions">
    <button class="theme-toggle account-btn" id="accountBtn" data-action="openAccount" aria-label="Iniciar sesión" title="Mi cuenta">
      <span id="accountIcon"></span>
    </button>
    <button class="theme-toggle" id="themeToggle" data-action="toggleTheme" aria-label="Cambiar tema" title="Cambiar tema">
      <span id="themeIcon"></span>
    </button>
    </div>
  </div>

  <div id="screen"></div>

  <div class="brand-footer">
    Técnico en Emergencias Sanitarias
    <button type="button" class="debug-link" data-action="openDebugMode" aria-label="Modo depuración">·</button>
  </div>
</div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="pdf.js"></script>
<script src="cloud.js"></script>
<script src="bank.js"></script>
<script src="fun.js"></script>
<script src="app.js"></script>
</body>
</html>
