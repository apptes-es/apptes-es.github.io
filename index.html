<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#10233D">
<title>TES Test · Técnico en Emergencias Sanitarias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    var t = localStorage.getItem('tes_theme_v1');
    if(!t){ t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
    if(t === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  }catch(e){}
})();
</script>
<style>
:root{
  --font-head:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --font-body:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --navy:#10233D;
  --navy-2:#173A63;
  --primary:#1C5FB0;
  --primary-light:#8CC0F5;
  --hivis:#F5C518;
  --hivis-press:#D9AC0A;
  --hivis-green:#2FA35B;
  --siren:#E0312B;
  --bg:#EEF2F7;
  --card-bg:#FFFFFF;
  --text:#14202E;
  --text-muted:#566273;
  --border:#D9E0EA;
  --accent-text:#1C5FB0;
  --ok:#178A4C;
  --ok-bg:#E2F5E9;
  --ok-text:#0F5E33;
  --danger:#C62828;
  --danger-bg:#FCE6E4;
  --danger-text:#8E1B1B;
  --banner-bg:#FFF8DC;
  --badge-bg:#FFF1C2;
  --badge-text:#7A5A00;
  --tap-bg:#E4EAF2;
  --select-bg:#E3EEFB;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0B1522;
  --card-bg:#15233A;
  --text:#E7EDF5;
  --text-muted:#98A7BA;
  --border:#263853;
  --accent-text:#8CC0F5;
  --ok:#3DBE77;
  --ok-bg:#12321F;
  --ok-text:#86DDA9;
  --danger:#EF6B5E;
  --danger-bg:#3A1A18;
  --danger-text:#F4A89F;
  --banner-bg:#2A2410;
  --badge-bg:#3A2F0C;
  --badge-text:#F2D675;
  --tap-bg:#1C2D47;
  --select-bg:#1A3252;
  color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  line-height:1.5;
  transition:background-color .2s ease, color .2s ease;
}
h1,h2,h3{
  font-family:var(--font-head);
  font-weight:800;
  margin:0;
  letter-spacing:0.01em;
}
.app{
  max-width:640px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* ---------- HEADER ---------- */
.topbar{
  background:var(--navy);
  color:#fff;
  padding:0 18px 6px;
  height:66px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}
/* franja reflectante tipo ambulancia (Battenburg) */
.topbar::after{
  content:"";
  position:absolute; left:0; right:0; bottom:0;
  height:6px;
  background:repeating-linear-gradient(90deg, var(--hivis) 0 18px, var(--hivis-green) 18px 36px);
}
.topbar .brand{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  background:none; border:none; color:inherit; padding:0; font:inherit; text-align:left;
}
.brand-logo{
  width:38px; height:38px; border-radius:10px;
  background:#fff;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.topbar h1{font-size:21px; line-height:1; text-transform:uppercase;}
.topbar h1 span{color:var(--hivis);}
.topbar .sub{font-size:12px; color:var(--primary-light); margin-top:3px; line-height:1.2;}
.theme-toggle{
  width:36px; height:36px;
  border-radius:50%;
  background:rgba(255,255,255,0.12);
  border:none;
  color:#fff;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background .15s ease, transform .1s ease;
}
.theme-toggle:active{transform:scale(0.88); background:rgba(255,255,255,0.22);}

/* ---------- HOME ---------- */
.home{padding:24px 18px 40px; flex:1;}
.hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(155deg, var(--navy) 0%, var(--navy-2) 60%, var(--primary) 130%);
  color:#fff;
  border-radius:18px;
  padding:24px 22px 22px;
  margin-bottom:18px;
}
.hero-ecg{position:absolute; left:0; right:0; top:34px; width:100%; height:60px; opacity:0.1; pointer-events:none;}
.hero-top{display:flex; align-items:center; gap:14px; position:relative;}
.hero-top .hero-mascot{flex-shrink:0;}
.hero h2{font-size:30px; line-height:1.02; text-transform:uppercase; margin-bottom:6px;}
.hero h2 em{font-style:normal; color:var(--hivis);}
.hero p{font-size:14.5px; color:#D4E3F5; margin:12px 0 0; position:relative;}
.stat-row{display:flex; gap:8px; margin-top:18px; position:relative;}
.stat{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;
  padding:9px 11px;
  flex:1;
}
.stat b{display:block; font-size:24px; line-height:1.1; font-family:var(--font-head); color:var(--hivis);}
.stat span{font-size:11.5px; color:#C6D6EA; line-height:1.2; display:block;}

.section-label{
  font-family:var(--font-head);
  font-size:15px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--text-muted);
  margin:26px 0 10px;
  font-weight:700;
  display:flex; align-items:center; gap:8px;
}
.section-label::before{content:""; width:4px; height:14px; border-radius:2px; background:var(--siren);}

.home-tabs{
  display:flex;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:4px;
  margin:20px 0 4px;
  gap:4px;
}
.home-tab{
  flex:1;
  border:none;
  background:transparent;
  padding:10px;
  border-radius:9px;
  font-family:var(--font-head);
  font-size:16px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  font-weight:700;
  color:var(--text-muted);
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.home-tab.active{background:var(--navy); color:#fff;}
[data-theme="dark"] .home-tab.active{background:var(--primary);}

.btn-primary{
  width:100%;
  background:var(--hivis);
  color:var(--navy);
  border:none;
  border-radius:12px;
  padding:15px;
  font-size:18px;
  font-family:var(--font-head);
  text-transform:uppercase;
  letter-spacing:0.04em;
  font-weight:800;
  cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 3px 0 var(--hivis-press);
  transition:transform .08s ease, box-shadow .08s ease, background .15s ease;
}
.btn-primary:active{transform:translateY(2px); box-shadow:0 1px 0 var(--hivis-press);}

/* ---------- TARJETAS DE ASIGNATURA ---------- */
.subject-list{display:flex; flex-direction:column; gap:10px;}
.subject-card{
  position:relative;
  display:flex; align-items:center; gap:14px;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 14px 14px 18px;
  cursor:pointer;
  width:100%;
  text-align:left;
  font-family:inherit;
  color:var(--text);
  overflow:hidden;
  transition:transform .1s ease, border-color .15s ease;
}
.subject-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--sc);}
.subject-card:active{transform:scale(0.985);}
.subject-card:focus-visible{outline:2px solid var(--accent-text); outline-offset:2px;}
.sc-icon{
  width:46px; height:46px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--sc) 14%, transparent);
  color:var(--sc);
}
.sc-body{flex:1; min-width:0;}
.sc-body b{display:block; font-size:15.5px; line-height:1.25;}
.sc-body span{font-size:12.5px; color:var(--text-muted);}
.sc-meter{height:5px; background:var(--border); border-radius:4px; overflow:hidden; margin-top:7px;}
.sc-meter div{height:100%; background:var(--sc); border-radius:4px;}
.sc-arrow{color:var(--text-muted); flex-shrink:0;}

/* cabecera de asignatura */
.back-link{
  display:inline-flex; align-items:center; gap:4px;
  background:none; border:none; padding:4px 0; margin-bottom:12px;
  color:var(--accent-text); font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
}
.subject-hero{
  position:relative; overflow:hidden;
  background:linear-gradient(155deg, var(--navy) 0%, var(--navy-2) 70%);
  border-radius:18px;
  padding:20px 20px 18px;
  color:#fff;
  margin-bottom:18px;
}
.subject-hero::before{content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--sc);}
.subject-hero .sh-top{display:flex; align-items:center; gap:12px;}
.subject-hero .sc-icon{background:rgba(255,255,255,0.12); color:#fff;}
.subject-hero h2{font-size:25px; line-height:1.05; text-transform:uppercase;}

.exam-list{display:flex; flex-direction:column; gap:8px;}
.history{display:flex; flex-direction:column; gap:8px;}
.history-item{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  font-size:13.5px;
}
.history-item .score{font-weight:800; font-family:var(--font-head); font-size:19px; white-space:nowrap;}
.history-item .score.pass{color:var(--ok);}
.history-item .score.fail{color:var(--danger);}
.empty-hint{color:var(--text-muted); font-size:13.5px; font-style:italic;}

/* ---------- QUIZ ---------- */
.quiz{flex:1; display:flex; flex-direction:column; padding:0 0 30px;}
.progress-wrap{
  padding:14px 18px 6px;
  background:var(--bg);
  position:sticky;
  top:66px;
  z-index:9;
}
.progress-bar{height:8px; background:var(--border); border-radius:5px; overflow:hidden;}
.progress-fill{
  height:100%;
  background:repeating-linear-gradient(90deg, var(--hivis) 0 10px, var(--hivis-green) 10px 20px);
  transition:width .25s ease;
}
.progress-text{font-size:12.5px; color:var(--text-muted); margin-top:6px; display:flex; justify-content:space-between;}

.q-card{
  margin:14px 18px 0;
  background:var(--card-bg);
  border-radius:16px;
  padding:20px 18px;
  border:1px solid var(--border);
  border-top:4px solid var(--sc, var(--primary));
}
.q-card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
.q-tag{
  font-family:var(--font-head);
  font-size:13.5px;
  color:var(--sc, var(--accent-text));
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.05em;
  line-height:1.2;
}
[data-theme="dark"] .q-tag{filter:brightness(1.35);}
.q-tag small{display:block; color:var(--text-muted); font-family:var(--font-body); text-transform:none; letter-spacing:0; font-size:12px; font-weight:500;}
.mascot{display:flex; flex-shrink:0;}
@keyframes mascotReact{
  0%{transform:scale(0.7) rotate(-6deg);}
  55%{transform:scale(1.18) rotate(4deg);}
  100%{transform:scale(1) rotate(0);}
}
.mascot.react{animation:mascotReact .35s cubic-bezier(.3,1.4,.4,1);}
@keyframes sirenFlash{0%,100%{opacity:1;} 50%{opacity:0.25;}}
.siren-a{animation:sirenFlash .5s infinite;}
.siren-b{animation:sirenFlash .5s infinite .25s;}
@keyframes wobble{0%,100%{transform:rotate(0);} 25%{transform:rotate(-3deg);} 75%{transform:rotate(3deg);}}
.mascot-idle{animation:wobble 3s ease-in-out infinite; transform-origin:50% 90%;}

.q-text{font-size:18px; font-weight:600; line-height:1.4; color:var(--text); margin-bottom:18px;}
.options{display:flex; flex-direction:column; gap:10px;}
.option{
  display:flex;
  align-items:flex-start;
  gap:12px;
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:11px;
  padding:13px 14px;
  font-size:15px;
  cursor:pointer;
  transition:border-color .12s ease, background .12s ease;
  width:100%;
  text-align:left;
  font-family:inherit;
  color:var(--text);
  -webkit-appearance:none;
  appearance:none;
}
.option:focus-visible{outline:2px solid var(--accent-text); outline-offset:2px;}
.option:disabled{cursor:default;}
.option:active{background:var(--tap-bg);}
.option .letter{
  flex:0 0 27px;
  height:27px;
  border-radius:8px;
  background:var(--border);
  color:var(--accent-text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:15px;
  font-family:var(--font-head);
}
.option.selected{border-color:var(--primary); background:var(--select-bg);}
.option.selected .letter{background:var(--primary); color:#fff;}
.option.correct{border-color:var(--ok); background:var(--ok-bg);}
.option.correct .letter{background:var(--ok); color:#fff;}
.option.incorrect{border-color:var(--danger); background:var(--danger-bg);}
.option.incorrect .letter{background:var(--danger); color:#fff;}
.option.disabled{cursor:default;}

.feedback{
  margin-top:14px;
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
  font-weight:500;
  display:none;
}
.feedback.show{display:flex; gap:8px; align-items:flex-start;}
.feedback.show svg{flex-shrink:0; margin-top:3px;}
.feedback.ok{background:var(--ok-bg); color:var(--ok-text);}
.feedback.no{background:var(--danger-bg); color:var(--danger-text);}

@keyframes comboPop{0%{opacity:0; transform:translateY(4px) scale(0.9);} 100%{opacity:1; transform:translateY(0) scale(1);}}
.combo-badge{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:8px;
  padding:5px 12px;
  border-radius:20px;
  background:var(--hivis);
  color:var(--navy);
  font-size:13px;
  font-weight:700;
  animation:comboPop .25s ease;
}

.nav-buttons{display:flex; gap:10px; margin:18px 18px 0;}
.btn-secondary{
  flex:1;
  background:transparent;
  border:1.5px solid var(--border);
  color:var(--text);
  border-radius:11px;
  padding:13px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn-secondary:disabled{opacity:0.35; cursor:default;}
.nav-buttons .btn-primary{flex:1; padding:12px; font-size:17px;}

/* dot nav */
.dotnav{display:flex; flex-wrap:wrap; gap:6px; margin:16px 18px 0;}
.dot{
  width:28px; height:28px;
  border-radius:8px;
  border:1.5px solid var(--border);
  background:var(--card-bg);
  font-size:13px;
  color:var(--text-muted);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  font-family:var(--font-head);
  font-weight:700;
  padding:0;
  -webkit-appearance:none;
  appearance:none;
}
.dot:focus-visible{outline:2px solid var(--accent-text); outline-offset:2px;}
.dot.current{border-color:var(--accent-text); border-width:2px;}
.dot.answered-ok{background:var(--ok); color:#fff; border-color:var(--ok);}
.dot.answered-no{background:var(--danger); color:#fff; border-color:var(--danger);}

/* ---------- RESULTS ---------- */
.results{padding:24px 18px 40px;}
.result-hero{
  position:relative;
  overflow:hidden;
  text-align:center;
  padding:26px 20px 28px;
  border-radius:18px;
  margin-bottom:20px;
}
.result-hero.pass{background:linear-gradient(160deg,#0C4F2C,#178A4C); color:#fff;}
.result-hero.fail{background:linear-gradient(160deg,#6E1414,#C62828); color:#fff;}
.result-hero .rh-mascot{position:relative; z-index:1; display:flex; justify-content:center; margin-bottom:6px;}
.result-hero .big-score{font-size:60px; line-height:1; font-family:var(--font-head); font-weight:800; position:relative; z-index:1;}
.result-hero .big-label{font-size:14px; opacity:0.92; margin-top:4px; position:relative; z-index:1;}
.result-hero .rh-msg{font-size:14.5px; margin:10px auto 0; max-width:420px; position:relative; z-index:1;}
.result-hero .verdict{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:14px;
  padding:6px 16px;
  border-radius:20px;
  background:rgba(255,255,255,0.2);
  font-family:var(--font-head);
  font-size:16px;
  letter-spacing:0.05em;
  font-weight:700;
  position:relative;
  z-index:1;
}

.confetti-wrap{position:absolute; inset:0; pointer-events:none;}
.confetti-piece{
  position:absolute;
  top:-12px;
  width:7px; height:12px;
  border-radius:1px;
  opacity:0.95;
  animation-name:confettiFall;
  animation-timing-function:ease-in;
  animation-fill-mode:forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg); opacity:1;}
  100%{transform:translateY(190px) rotate(340deg); opacity:0;}
}

@keyframes celebrateIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
.celebrate-banner{
  display:flex; align-items:center; gap:8px;
  background:var(--hivis);
  color:var(--navy);
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  font-weight:700;
  margin-bottom:10px;
  animation:celebrateIn .3s ease;
}

@keyframes legendaryIn{
  0%{opacity:0; transform:scale(0.85) translateY(10px);}
  60%{transform:scale(1.03);}
  100%{opacity:1; transform:scale(1) translateY(0);}
}
.legendary-banner{
  position:relative;
  overflow:hidden;
  text-align:center;
  background:linear-gradient(160deg, #8B6914, #D9A227 45%, #F0C860);
  border-radius:18px;
  padding:26px 20px;
  margin-bottom:16px;
  animation:legendaryIn .5s cubic-bezier(.22,.9,.3,1.2);
}
.legendary-icon{
  position:relative; z-index:1;
  width:56px; height:56px;
  border-radius:50%;
  background:rgba(255,255,255,0.35);
  color:#3A2C05;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 10px;
}
.legendary-banner b{
  position:relative; z-index:1;
  display:block;
  font-family:var(--font-head);
  font-size:24px;
  letter-spacing:0.03em;
  color:#3A2C05;
  margin-bottom:8px;
}
.legendary-banner span{position:relative; z-index:1; display:block; font-size:13.5px; line-height:1.5; color:#4A3A0A;}
.reward-btn{
  position:relative; z-index:1;
  display:inline-flex; align-items:center; gap:6px;
  margin-top:14px;
  background:#3A2C05;
  color:#F0C860;
  text-decoration:none;
  padding:10px 18px;
  border-radius:24px;
  font-size:13px;
  font-weight:700;
  font-family:inherit;
}
.reward-btn:active{opacity:0.85;}

/* ---------- LOGROS ---------- */
.record-card{
  display:flex; align-items:center; gap:14px;
  background:linear-gradient(155deg, var(--navy), var(--navy-2));
  color:#fff;
  border-radius:16px;
  padding:16px 18px;
}
.record-icon{
  flex:0 0 auto;
  width:46px; height:46px;
  border-radius:50%;
  background:var(--hivis);
  color:var(--navy);
  display:flex; align-items:center; justify-content:center;
}
.record-card b{display:block; font-size:30px; font-family:var(--font-head); line-height:1; color:var(--hivis);}
.record-card span{font-size:13px; color:#C6D6EA;}
.achv-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.achv-item{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 10px;
  text-align:center;
}
.achv-item .achv-icon{
  width:44px; height:44px; margin:0 auto 6px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--badge-bg); color:var(--badge-text);
}
.achv-item.locked{opacity:0.45;}
.achv-item.locked .achv-icon{background:var(--border); color:var(--text-muted);}
.achv-item b{display:block; font-size:13.5px; margin-bottom:3px;}
.achv-item span{font-size:11.5px; color:var(--text-muted); line-height:1.3; display:block;}

@keyframes pop{0%{transform:scale(0.65);} 65%{transform:scale(1.15);} 100%{transform:scale(1);}}

const MASTERY_KEY = 'tes_mastered_ids_v1';

function passScoreFor(total){ return Math.ceil(total * PASS_RATIO); }

/* ---------------- ASIGNATURAS ---------------- */
function getSubject(id){ return SUBJECTS.find(s=>s.id===id) || {id, name:id||'Sin asignatura', short:id||'—', icon:'book', color:'#1C5FB0'}; }
function questionsOf(subjectId){ return QUESTIONS.filter(q=>q.subject===subjectId); }
function temasOf(subjectId){
  const out = [];
  questionsOf(subjectId).forEach(q=>{ if(!out.includes(q.exam)) out.push(q.exam); });
  return out;
}
function subjectMastery(subjectId){
  const qs = questionsOf(subjectId);
  if(!qs.length) return 0;
  const m = new Set(loadMasteredIds());
  return Math.round(qs.filter(q=>m.has(q.id)).length / qs.length * 100);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  if(correct) return CORRECT_PHRASES[Math.floor(Math.random()*CORRECT_PHRASES.length)];

function resultMessage(pct){
  if(pct === 100) return 'Turno perfecto. Todos los pacientes atendidos y ni una incidencia.';

    const rot = Math.floor(Math.random()*360);
    out += `<span class="confetti-piece" style="left:${left}%; background:${color}; animation-delay:${delay}s; animation-duration:${dur}s; transform:rotate(${rot}deg);"></span>`;
  }
  return out + '</div>';
}

/* ---------------- UTIL ---------------- */
function safeGetJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null) return fallback;
    const v = JSON.parse(raw);
    return v === null || v === undefined ? fallback : v;
  }catch(e){ return fallback; }
}
function safeSetJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ return false; }
}
function safeRemove(key){ try{ localStorage.removeItem(key); }catch(e){} }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function findQuestionById(id){ return QUESTIONS.find(q=>q.id===id); }

  h.unshift(entry);
  safeSetJSON(HISTORY_KEY, h.slice(0,80));
}
// Agrega aciertos por clave a partir del campo "field" de cada entrada del historial
function aggregate(history, field, filterFn){
  const agg = {};
  history.forEach(h=>{
    const b = h[field];
    if(!b) return;
    Object.keys(b).forEach(k=>{
      if(filterFn && !filterFn(k)) return;
      if(!agg[k]) agg[k] = {correct:0, total:0};
      agg[k].correct += b[k].correct;
      agg[k].total += b[k].total;
    });
  });
  return agg;
}

/* ---------------- BARAJADO ---------------- */
// Opciones que hacen referencia a otras por letra/posición: no se barajan.
const NO_SHUFFLE_PATTERNS = [
  /\b[a-dA-D]\s+y\s+[a-dA-D]\b/,
  /\brespuestas?\s+[a-dA-D]\b/i,
  /anteriores/i,
  /todas\s+(las\s+)?(respuestas\s+)?son\s+correctas/i,
  /ninguna\s+(de\s+las\s+)?(es|son)\s+correcta/i,
  /solo\s+la\s+[a-dA-D]\b/i,
  /\bambas\b/i,
];
function needsFixedOrder(q){ return q.options.length <= 2 || q.options.some(opt => NO_SHUFFLE_PATTERNS.some(p=>p.test(opt))); }
function shuffleQuestionOptions(q){
  const base = { id:q.id, subject:q.subject, exam:q.exam, text:q.text, unverified:!!q.u };
  if(needsFixedOrder(q)) return { ...base, options:q.options.slice(), correct:q.correct };
  const shuffled = shuffle(q.options.map((_,i)=>i));
  return { ...base, options:shuffled.map(i=>q.options[i]), correct:shuffled.indexOf(q.correct) };
}
function modeLabel(test){
  const s = test.subject ? getSubject(test.subject) : null;
  if(test.mode === 'subject') return s.short + ' · Simulacro';
  if(test.mode === 'exam') return s.short + ' · ' + test.label;
  if(test.mode === 'review') return 'Repaso de falladas';
  if(test.mode === 'failed') return 'Falladas guardadas' + (s ? ' · ' + s.short : '');
  if(test.mode === 'unverified') return 'Preguntas no verificadas';
  return 'Simulacro general';
}
function historyTag(h){
  const s = h.subject ? getSubject(h.subject) : null;
  if(h.mode === 'subject') return 'Simulacro · ' + s.short;
  if(h.mode === 'exam') return s.short + ' · ' + h.label;
  if(h.mode === 'review' || h.mode === 'failed') return 'Repaso' + (s ? ' · ' + s.short : '');
  if(h.mode === 'unverified') return 'Revisión';
  return 'Simulacro general';
}

/* ---------------- CONSTRUCCIÓN DE TESTS ---------------- */
function makeTestShell(mode, subject, label, questions){
  return { mode, subject, label, questions, answers:new Array(questions.length).fill(null), phrases:new Array(questions.length).fill(null), timed:false, endTime:null };
}
/* ---------------- SELECCIÓN ALEATORIA SIN REPETICIONES ---------------- */
function normText(t){ return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
// Elimina duplicados: mismo id, o mismo enunciado con la misma respuesta correcta
// (por si una pregunta se repite en dos tests distintos de la plataforma).
function dedupe(pool){
  const seenIds = new Set(), seenKeys = new Set(), out = [];
  pool.forEach(q=>{
    const key = normText(q.text) + '|' + normText(q.options[q.correct]);
    if(seenIds.has(q.id) || seenKeys.has(key)) return;
    seenIds.add(q.id); seenKeys.add(key); out.push(q);
  });
  return out;
}
function loadSeen(){ const v = safeGetJSON(SEEN_KEY, null); return (v && v.last) ? v : {n:0, last:{}}; }
function loadRecent(){ return safeGetJSON(RECENT_KEY, {}); }
// Reparte "size" preguntas sin repetir ninguna dentro del test y evitando las
// que salieron en los tests aleatorios anteriores del mismo ámbito:
//   1º preguntas que no salieron en los 2 últimos tests,
//   2º las del penúltimo test, 3º (solo si no queda otra) las del último.
// Dentro de cada nivel se prioriza lo que lleva más tiempo sin salir y se
// reparte por turnos entre temas/asignaturas para que todos estén representados.
function pickFresh(pool, keyFn, size, scope){
  pool = dedupe(pool);
  const seen = loadSeen();
  const recent = loadRecent()[scope] || [];
  const last = new Set(recent[0] || []), prev = new Set(recent[1] || []);
  const tierOf = q => last.has(q.id) ? 2 : (prev.has(q.id) ? 1 : 0);
  const age = q => (q.id in seen.last) ? seen.last[q.id] : -1;
  const picked = [], used = new Set();
  for(let tier=0; tier<=2 && picked.length<size; tier++){
    const groups = {};
    pool.filter(q=>tierOf(q)===tier).forEach(q=>{ const k = keyFn(q); (groups[k] = groups[k] || []).push(q); });
    // orden: lo más antiguo primero; empates al azar
    const lists = shuffle(Object.keys(groups)).map(k=>shuffle(groups[k]).sort((x,y)=>age(x)-age(y)));
    let added = true;
    while(picked.length < size && added){
      added = false;
      for(const l of lists){
        if(picked.length >= size) break;
        const q = l.shift();
        if(q && !used.has(q.id)){ picked.push(q); used.add(q.id); added = true; }
      }
    }
  }
  return shuffle(picked);
}
// Guarda qué preguntas han salido, para que el siguiente test las evite.
function rememberTest(questions, scope){
  const seen = loadSeen();
  seen.n++;
  questions.forEach(q=>{ seen.last[q.id] = seen.n; });
  safeSetJSON(SEEN_KEY, seen);
  const recent = loadRecent();
  recent[scope] = [questions.map(q=>q.id), (recent[scope] && recent[scope][0]) || []];
  safeSetJSON(RECENT_KEY, recent);
}
function buildTest(){
  const picked = pickFresh(QUESTIONS, q=>q.subject, TEST_SIZE, 'mixed');
  rememberTest(picked, 'mixed');
  return makeTestShell('mixed', null, null, picked.map(shuffleQuestionOptions));
}
function buildSubjectTest(subjectId){
  const scope = 'subject:' + subjectId;
  const picked = pickFresh(questionsOf(subjectId), q=>q.exam, TEST_SIZE, scope);
  rememberTest(picked, scope);
  return makeTestShell('subject', subjectId, null, picked.map(shuffleQuestionOptions));
}
function buildExamTest(subjectId, tema){
  const picked = shuffle(dedupe(questionsOf(subjectId).filter(q=>q.exam === tema)));
  return makeTestShell('exam', subjectId, tema, picked.map(shuffleQuestionOptions));
}
function buildReviewTest(ids, mode, subjectId){
  const picked = shuffle(dedupe(ids.map(findQuestionById).filter(Boolean)));
  return makeTestShell(mode || 'review', subjectId || null, null, picked.map(shuffleQuestionOptions));
}

}
function launch(test, allowTimed){
  if(!test.questions.length) return;

}
function startTest(){ launch(buildTest(), true); }
function startSubjectTest(subjectId){ launch(buildSubjectTest(subjectId), true); }
function startExamTest(subjectId, temaIdx){

  if(tema === undefined) return;
  launch(buildExamTest(subjectId, tema), true);
}
function startExamTestByName(subjectId, tema){ launch(buildExamTest(subjectId, tema), true); }
function startReviewTest(ids, mode, subjectId){

}

}

  const ids = failedIdsOf(subjectId);
  if(!ids.length) return;
  startReviewTest(shuffle(ids).slice(0, TEST_SIZE), 'failed', subjectId);
}
function repeatTest(){
  const t = currentTest;
  if(t.mode === 'exam') startExamTestByName(t.subject, t.label);
  else if(t.mode === 'subject') startSubjectTest(t.subject);
  else if(t.mode === 'review') startReviewTest(t.questions.map(q=>q.id), 'review', t.subject);
  else if(t.mode === 'unverified') startUnverifiedTest(t.subject);
  else if(t.mode === 'failed') startFailedTest(t.subject);
  else startTest();
}
function continueTest(){
  const p = loadProgress();
  if(!p || !p.currentTest){ renderHome(); return; }
  currentTest = p.currentTest;
  currentIndex = p.currentIndex;
  startTimerIfNeeded();
  renderQuiz();
}

}
function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el || !currentTest || !currentTest.timed) return;
  const remaining = Math.max(0, currentTest.endTime - Date.now());
  const mins = Math.floor(remaining/60000);
  const secs = Math.floor((remaining%60000)/1000);
  el.innerHTML = `${icon('clock',13)} ${mins}:${secs.toString().padStart(2,'0')}`;
  el.classList.toggle('warn', remaining < 5*60*1000);
  if(remaining <= 0){ clearTimer(); finishTest(true); }
}

function renderQuiz(){

  const q = currentTest.questions[currentIndex];

  const answered = userAnswer !== null;

  const optionsHtml = q.options.map((opt,i)=>{
    let cls = 'option';
    let state = '';

      cls += ' disabled';

function selectAnswer(i){
  if(currentTest.answers[currentIndex] !== null) return;
  currentTest.answers[currentIndex] = i;
  if(!currentTest.phrases) currentTest.phrases = new Array(currentTest.questions.length).fill(null);

}

/* ---------------- RENDER: RESULTADOS ---------------- */
function finishTest(timeUp){
  clearTimer();
  const total = currentTest.questions.length;
  let score = 0;
  const subjBreakdown = {};
  const temaBreakdown = {};
  currentTest.questions.forEach((q,i)=>{
    const tk = q.subject + '::' + q.exam;
    if(!subjBreakdown[q.subject]) subjBreakdown[q.subject] = {correct:0, total:0};
    if(!temaBreakdown[tk]) temaBreakdown[tk] = {correct:0, total:0};
    subjBreakdown[q.subject].total++;
    temaBreakdown[tk].total++;
    if(currentTest.answers[i] === q.correct){
      score++;
      subjBreakdown[q.subject].correct++;
      temaBreakdown[tk].correct++;
    }
  });
  const maxCombo = computeMaxCombo(currentTest);
  currentTest.finishedAt = Date.now();

  const historyBefore = loadHistory();
  const prevBest = getBestPercent(historyBefore);
  const achvBefore = getAchievements(historyBefore).filter(a=>a.earned).map(a=>a.id);

  saveHistoryEntry({date:Date.now(), score, total, mode:currentTest.mode, subject:currentTest.subject, label:currentTest.label, subjBreakdown, temaBreakdown, maxCombo});
  updateFailedBank();
  updateMasteredIds();
  clearProgress();

  const newPercent = Math.round(score/total*100);
  const isNewRecord = historyBefore.length>0 && (prevBest===null || newPercent>prevBest);
  const newlyUnlocked = getAchievements(loadHistory()).filter(a=>a.earned && !achvBefore.includes(a.id));

  renderResults(score, total, !!timeUp, isNewRecord, newlyUnlocked);
}

function animateScoreCount(target){
  const el = document.getElementById('scoreCount');
  if(!el || typeof requestAnimationFrame === 'undefined'){ if(el) el.textContent = target; return; }
  const duration = 650;
  const start = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  function step(now){
    const t = Math.min(1, (now - start)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(eased*target);
    if(t < 1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

const WINANSI_EXTRA = {'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};
function pdfCode(ch){
  const c = ch.charCodeAt(0);
  if(c >= 32 && c < 127) return c;
  if(c >= 160 && c <= 255) return c;
  if(WINANSI_EXTRA[ch]) return WINANSI_EXTRA[ch];
  return 63; // '?'
}
function pdfEncode(str){
  let out = '';
  for(const ch of String(str).replace(/\s+/g,' ')){
    const code = pdfCode(ch);
    const c = String.fromCharCode(code);
    out += (c === '(' || c === ')' || c === '\\') ? '\\' + c : c;
  }
  return out;
}
function pdfTextWidth(str, font, size){
  let w = 0;
  for(const ch of String(str)) w += PDF_W[font][pdfCode(ch)] || 500;
  return w * size / 1000;
}
function pdfWrap(str, font, size, maxW){
  const words = String(str).replace(/\s+/g,' ').trim().split(' ');
  const lines = [];
  let line = '';
  words.forEach(word=>{
    const test = line ? line + ' ' + word : word;
    if(pdfTextWidth(test, font, size) <= maxW || !line){ line = test; }
    else { lines.push(line); line = word; }
  });
  if(line) lines.push(line);
  return lines.length ? lines : [''];
}
function hexToRgb(hex){
  const h = hex.replace('#','');
  return [0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ');
}
function PdfDoc(){
  const W = 595.28, H = 841.89, M = 42;
  const pages = [];
  let ops = null, y = 0;
  const api = {
    W, H, M,
    get y(){ return y; }, set y(v){ y = v; },
    newPage(){ ops = []; pages.push(ops); y = H - M; },
    ensure(h){ if(y - h < M + 24) api.newPage(); },
    rect(x, yTop, w, h, color){ ops.push(`${hexToRgb(color)} rg ${x.toFixed(2)} ${(yTop-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); },
    text(str, x, yBase, font, size, color){
      ops.push(`BT /${font} ${size} Tf ${hexToRgb(color||'#14202E')} rg ${x.toFixed(2)} ${yBase.toFixed(2)} Td (${pdfEncode(str)}) Tj ET`);
    },
    // Escribe un párrafo con salto de línea automático y avanza "y"
    para(str, x, maxW, font, size, color, lineH){
      lineH = lineH || size * 1.35;
      pdfWrap(str, font, size, maxW).forEach(l=>{
        api.ensure(lineH);
        api.text(l, x, y - size, font, size, color);
        y -= lineH;
      });
    },
    output(){
      const total = pages.length;
      pages.forEach((p, i)=>{
        p.push(`BT /F1 8 Tf ${hexToRgb('#566273')} rg ${M} 22 Td (${pdfEncode('TES Test · Técnico en Emergencias Sanitarias')}) Tj ET`);
        const t = `Página ${i+1} de ${total}`;
        p.push(`BT /F1 8 Tf ${hexToRgb('#566273')} rg ${(W - M - pdfTextWidth(t,'F1',8)).toFixed(2)} 22 Td (${pdfEncode(t)}) Tj ET`);
      });
      const objs = [];
      objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      const kids = [];
      pages.forEach((p, i)=>{
        const pageId = 5 + i*2, contId = 6 + i*2;
        const stream = p.join('\n');
        objs[contId] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
        objs[pageId] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contId} 0 R >>`;
        kids.push(`${pageId} 0 R`);
      });
      objs[2] = `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;
      let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
      const offsets = [];
      for(let i=1;i<objs.length;i++){
        offsets[i] = out.length;
        out += `${i} 0 obj\n${objs[i]}\nendobj\n`;
      }
      const xref = out.length;
      out += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
      for(let i=1;i<objs.length;i++) out += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
      out += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
      const bytes = new Uint8Array(out.length);
      for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 0xFF;
      return bytes;
    }
  };
  api.newPage();
  return api;
}

function buildResultPdf(test){
  const doc = PdfDoc();
  const {W, M} = doc;
  const CW = W - 2*M;
  const total = test.questions.length;
  const score = test.questions.filter((q,i)=>test.answers[i] === q.correct).length;
  const pct = total ? Math.round(score/total*100) : 0;
  const pass = score >= passScoreFor(total);
  const when = new Date(test.finishedAt || Date.now());
  const dateStr = when.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}) + ' · ' + when.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});

  // Cabecera
  doc.rect(0, doc.H, W, 92, '#10233D');
  for(let x=0, i=0; x<W; x+=18, i++) doc.rect(x, doc.H-92, 18, 6, i%2 ? '#2FA35B' : '#F5C518');
  doc.text('TES TEST', M, doc.H-40, 'F2', 22, '#F5C518');
  doc.text('Técnico en Emergencias Sanitarias', M, doc.H-58, 'F1', 10, '#FFFFFF');
  doc.text(modeLabel(test), M, doc.H-74, 'F2', 11, '#8CC0F5');
  doc.y = doc.H - 92 - 22;

  // Resumen
  const boxH = 64;
  doc.rect(M, doc.y, CW, boxH, pass ? '#E2F5E9' : '#FCE6E4');
  doc.rect(M, doc.y, 6, boxH, pass ? '#178A4C' : '#C62828');
  doc.text(`${score}/${total}`, M+20, doc.y-40, 'F2', 30, pass ? '#0F5E33' : '#8E1B1B');
  const verdict = pass ? 'APTO' : 'NO APTO';
  doc.text(verdict, M+150, doc.y-26, 'F2', 16, pass ? '#0F5E33' : '#8E1B1B');
  doc.text(`${pct}% de aciertos · aprobado con ${passScoreFor(total)}/${total}`, M+150, doc.y-44, 'F1', 10, '#14202E');
  doc.text(dateStr, M+150, doc.y-57, 'F1', 9, '#566273');
  doc.y -= boxH + 22;

  const LETTERS_ = LETTERS;
  test.questions.forEach((q, i)=>{
    const ans = test.answers[i];
    const ok = ans === q.correct;
    const status = ans === null ? 'SIN RESPONDER' : (ok ? 'ACIERTO' : 'FALLO');
    const statusCol = ans === null ? '#7A5A00' : (ok ? '#178A4C' : '#C62828');
    const subj = getSubject(q.subject);

    doc.ensure(70);
    doc.rect(M, doc.y, 3, 12, subj.color);
    doc.text(`${i+1}. ${subj.short} · ${q.exam}`.toUpperCase(), M+9, doc.y-9, 'F2', 7.5, '#566273');
    doc.text(status, W - M - pdfTextWidth(status,'F2',8.5), doc.y-9, 'F2', 8.5, statusCol);
    doc.y -= 17;
    doc.para(q.text, M, CW, 'F2', 10.5, '#14202E');
    doc.y -= 3;
    q.options.forEach((opt, k)=>{
      let color = '#3B4656', font = 'F1', suffix = '';
      if(k === q.correct){ color = '#0F7A40'; font = 'F2'; suffix = ans === k ? '   (tu respuesta · correcta)' : '   (correcta)'; }
      else if(k === ans){ color = '#C62828'; font = 'F2'; suffix = '   (tu respuesta)'; }
      const prefix = LETTERS_[k] + ')';
      const lines = pdfWrap(opt + suffix, font, 9.5, CW - 22);
      lines.forEach((l, li)=>{
        doc.ensure(13);
        if(li === 0) doc.text(prefix, M+6, doc.y-9.5, font, 9.5, color);
        doc.text(l, M+22, doc.y-9.5, font, 9.5, color);
        doc.y -= 13;
      });
    });
    doc.y -= 12;
  });
  return doc.output();
}
function pdfFileName(test){
  const d = new Date(test.finishedAt || Date.now());
  const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
  const label = modeLabel(test).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  return `TES_${label}_${stamp}.pdf`;
}
function downloadResultPdf(){
  if(!currentTest || !currentTest.questions.length) return;
  try{
    const bytes = buildResultPdf(currentTest);
    const blob = new Blob([bytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = pdfFileName(currentTest);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    console.error(e);
    alert('No se pudo generar el PDF.');
  }
}

  // Descarta un test a medias guardado con un formato antiguo (sin asignatura)
  const p = loadProgress();
  if(p && p.currentTest && (!p.currentTest.questions || p.currentTest.questions.some(q=>!q.subject))) clearProgress();
  document.getElementById('brandLogo').innerHTML = starOfLifeSVG(28);
  applyThemeIcon();
  renderHome();
})();
</script>
